name: CI

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - name: Run unit tests
        run: go test -race ./...

      - name: Run E2E tests with binary
        run: go test -tags e2e -count=1 ./test/e2e/...

      - name: Run E2E tests with Docker image
        run: go test -tags e2e -count=1 ./test/e2e/...
        env:
          E2E_DOCKER: "1"
